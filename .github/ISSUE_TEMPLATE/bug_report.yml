name: Bug report
description: NoteDelta produced a wrong, confusing or failing result
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do not attach notebooks containing confidential data or secrets.
        A minimal notebook pair that reproduces the problem helps most.
  - type: input
    id: version
    attributes:
      label: NoteDelta version
      description: Output of `notedelta --version` (and the VS Code extension version, if relevant)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and configuration
      description: The command you ran and the relevant part of `.notedelta.yml`
      render: shell
  - type: textarea
    id: output
    attributes:
      label: Output or report excerpt
      render: text
